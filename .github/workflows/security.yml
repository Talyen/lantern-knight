name: Dependency security
on:
  pull_request:
    paths: ['package.json', 'package-lock.json', 'tools/segmentation/requirements.txt', '.github/workflows/security.yml', '.github/actions/setup/action.yml']
  push:
    branches: [main]
    paths: ['package.json', 'package-lock.json', 'tools/segmentation/requirements.txt', '.github/workflows/security.yml', '.github/actions/setup/action.yml']
  schedule:
    - cron: '23 10 * * 1'
  workflow_dispatch:
permissions:
  contents: read
env:
  NODE_VERSION: '24.22.1'
  NPM_VERSION: '11.16.0'
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm audit --audit-level=moderate
      - name: Audit pinned Python authoring requirements
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/security-python"
          "$RUNNER_TEMP/security-python/bin/pip" install --disable-pip-version-check pip-audit==2.10.1
          "$RUNNER_TEMP/security-python/bin/pip-audit" -r tools/segmentation/requirements.txt --no-deps --disable-pip
