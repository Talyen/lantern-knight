name: Prototype verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prototype-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  NODE_VERSION: '24.18.0'
  NPM_VERSION: '11.16.0'
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      desktop: ${{ steps.impact.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Ensure pinned npm
        shell: bash
        run: |
          if [ "$(npm --version)" != "$NPM_VERSION" ]; then
            npm install --global "npm@$NPM_VERSION" --no-audit --no-fund
          fi
      - run: npm ci
      - name: Fetch comparison base
        env:
          COMPARISON_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git fetch --no-tags --depth=1 origin "$COMPARISON_BASE" || true
      - name: Select desktop coverage
        id: impact
        env:
          LANTERN_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node --import tsx tools/ci-impact.ts
      - name: Configure external cache
        run: echo "LANTERN_CACHE_ROOT=$RUNNER_TEMP/LanternKnight" >> "$GITHUB_ENV"
      - run: npm run check:ci
      - run: npm run assets:check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- game scene
      - name: Authoring browser checks
        if: steps.impact.outputs.authoring == 'true'
        run: npm run test:browser -- editor effects
      - run: git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-failure-${{ github.sha }}
          path: .cache/browser-results/
          retention-days: 3
          if-no-files-found: ignore
  desktop:
    needs: checks
    if: needs.checks.outputs.desktop == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
          - os: windows-2025
            platform: win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Ensure pinned npm
        shell: bash
        run: |
          if [ "$(npm --version)" != "$NPM_VERSION" ]; then
            npm install --global "npm@$NPM_VERSION" --no-audit --no-fund
          fi
      - run: npm ci
      - name: Configure external cache
        shell: bash
        run: echo "LANTERN_CACHE_ROOT=$RUNNER_TEMP/LanternKnight" >> "$GITHUB_ENV"
      - run: npm run package -- --platform ${{ matrix.platform }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run test:desktop
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: desktop-failure-${{ matrix.platform }}-${{ github.sha }}
          path: .cache/browser-results/
          retention-days: 3
          if-no-files-found: ignore
