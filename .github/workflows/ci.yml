name: Systems verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_delivery:
        description: Run the long shared rendering/gameplay journeys
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: systems-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  NODE_VERSION: '24.18.0'
  NPM_VERSION: '11.16.0'
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      desktop: ${{ steps.impact.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Ensure pinned npm
        shell: bash
        run: |
          if [ "$(npm --version)" != "$NPM_VERSION" ]; then
            npm install --global "npm@$NPM_VERSION" --no-audit --no-fund
          fi
      - run: npm ci
      - name: Fetch PR comparison base
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        # Missing history conservatively selects desktop coverage.
        run: git fetch --no-tags --depth=1 origin "$PR_BASE" || true
      - name: Select desktop coverage
        id: impact
        env:
          LANTERN_CI_BASE: ${{ github.event.pull_request.base.sha }}
        run: node --import tsx tools/verification-plan.ts --ci
      - name: Configure external asset cache
        shell: bash
        run: echo "LANTERN_CACHE_ROOT=$RUNNER_TEMP/LanternKnight" >> "$GITHUB_ENV"
      - run: npm run check:full
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: asset-check-failures-${{ github.sha }}
          path: ${{ runner.temp }}/LanternKnight/entries/diagnostics-*
          retention-days: 3
          if-no-files-found: ignore
      - run: npm run build
      - run: npm run build:dev
      - run: git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ github.sha }}
          path: |
            dist/
            dist-electron/
            dist-dev/
            dist-electron-dev/
            !dist/**/*.png
            !dist/**/*.mp4
            !dist-dev/**/*.png
            !dist-dev/**/*.mp4
          retention-days: 3
  desktop:
    needs: checks
    if: needs.checks.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
          - os: windows-2025
            platform: win
    runs-on: ${{ matrix.os }}
    # Checks plus the longest desktop job cap execution at ten minutes.
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Ensure pinned npm
        shell: bash
        run: |
          if [ "$(npm --version)" != "$NPM_VERSION" ]; then
            npm install --global "npm@$NPM_VERSION" --no-audit --no-fund
          fi
      - run: npm ci
      - name: Configure external asset cache
        shell: bash
        run: echo "LANTERN_CACHE_ROOT=$RUNNER_TEMP/LanternKnight" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-${{ github.sha }}
          path: .
      - run: npm run build:restore
      - run: npm run build:verify
      - run: npm run build:dev:verify
      - run: npm run package:${{ matrix.platform }}:prebuilt
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run package:dev:${{ matrix.platform }}:prebuilt
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Platform integration
        if: github.event_name != 'workflow_dispatch' || !inputs.full_delivery
        run: npm run test:e2e
      - name: Full delivery journeys
        if: github.event_name == 'workflow_dispatch' && inputs.full_delivery
        run: npm run test:e2e -- --full
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: desktop-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ runner.temp }}/LanternKnight/entries/diagnostics-*
          retention-days: 3
